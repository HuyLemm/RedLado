spring.application.name=redlado
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:redlado;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Base64-encoded 256-bit key (example only; replace in prod)
security.jwt.secret=ZmFrZS1yZWRsYWRvLXNlY3JldC1rZXktMzJieXRlc2Zha2Vfa2V5X3JlcGxhY2VfbWU=
security.jwt.expiration-ms=86400000

# CORS allowed origins (comma-separated). Adjust for your frontend URLs.
app.cors.allowed-origins=http://localhost:3000
